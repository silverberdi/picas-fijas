name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=@picas-fijas/game-core
      - run: npm run test --workspace=@picas-fijas/web
      - run: npm run build --workspace=@picas-fijas/web -- --base-href /
      - name: Prepare static site
        env:
          WS_URL: ${{ vars.PICAS_WS_URL }}
        run: |
          cd apps/web/dist/web/browser
          test -s index.html
          test -s assets/runtime-config.js
          node -e 'const fs=require("node:fs"); fs.appendFileSync("assets/runtime-config.js", "\nif ("+JSON.stringify(process.env.WS_URL || "")+") globalThis.__PICAS_FIJAS_CONFIG__.wsUrl = "+JSON.stringify(process.env.WS_URL || "")+";\n");'
          cp index.html 404.html
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
