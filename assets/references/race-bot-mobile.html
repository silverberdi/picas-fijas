<script>
    (() => {
      let currentDigits = ['6', '9'];
      const maxDigits = 4;
      const slots = [
        document.getElementById('slot-0'),
        document.getElementById('slot-1'),
        document.getElementById('slot-2'),
        document.getElementById('slot-3')
      ];

      const updateSlots = () => {
        slots.forEach((slot, index) => {
          const textSpan = slot.querySelector('.digit-text');
          if (index < currentDigits.length) {
            textSpan.textContent = currentDigits[index];
            textSpan.className = 'digit-text font-display font-extrabold text-2xl text-ink';
            slot.className = 'h-13 py-2 bg-lavender rounded-xl border-2 border-grape/40 shadow-[0_3px_0_#D5C4FF] flex items-center justify-center';
          } else if (index === currentDigits.length) {
            textSpan.textContent = '_';
            textSpan.className = 'digit-text font-display font-extrabold text-2xl text-grape animate-pulse';
            slot.className = 'h-13 py-2 bg-cream rounded-xl border-2 border-grape shadow-[0_3px_0_#7047EB] flex items-center justify-center';
          } else {
            textSpan.textContent = '_';
            textSpan.className = 'digit-text font-display font-extrabold text-2xl text-ink-muted/50';
            slot.className = 'h-13 py-2 bg-cream/70 rounded-xl border-2 border-lavender-dark shadow-[0_3px_0_#D5C4FF] flex items-center justify-center';
          }
        });

        document.querySelectorAll('.key-pad').forEach(btn => {
          const digit = btn.textContent.trim();
          if (currentDigits.includes(digit)) {
            btn.className = 'key-pad h-11 bg-lavender/60 rounded-xl border-2 border-lavender-dark shadow-[0_3px_0_#D5C4FF] font-display font-extrabold text-xl text-ink-muted/50 cursor-not-allowed';
          } else {
            btn.className = 'key-pad h-11 bg-white hover:bg-lavender/50 rounded-xl border-2 border-lavender-dark shadow-[0_3px_0_#D5C4FF] active:translate-y-0.5 active:shadow-none font-display font-extrabold text-xl text-ink transition-all';
          }
        });
      };

      let startTime = performance.now() - (77.5 * 1000);
      const timerElement = document.getElementById('race-timer');
      if (timerElement) {
        setInterval(() => {
          const elapsed = performance.now() - startTime;
          const totalSeconds = Math.floor(elapsed / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          const tenths = Math.floor((elapsed % 1000) / 100);
          timerElement.textContent =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
        }, 100);
      }

      document.querySelectorAll('.key-pad').forEach(btn => {
        btn.addEventListener('click', () => {
          const digit = btn.textContent.trim();
          if (currentDigits.length < maxDigits && !currentDigits.includes(digit)) {
            currentDigits.push(digit);
            updateSlots();
          }
        });
      });

      const backspaceBtn = document.getElementById('btn-backspace');
      if (backspaceBtn) {
        backspaceBtn.addEventListener('click', () => {
          if (currentDigits.length > 0) {
            currentDigits.pop();
            updateSlots();
          }
        });
      }

      const clearAllBtn = document.getElementById('btn-clear-all');
      if (clearAllBtn) {
        clearAllBtn.addEventListener('click', () => {
          currentDigits = [];
          updateSlots();
        });
      }
    })();
  </script>
