<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Picas y Fijas Party - ¡Ganaste!</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&amp;family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#FFF6E8",
            lavender: "#E9DFFF",
            "lavender-dark": "#D4C2FF",
            grape: "#7047EB",
            "grape-dark": "#5726D2",
            coral: "#FF7868",
            "coral-dark": "#E05545",
            sunny: "#FFD15C",
            "sunny-dark": "#E5AF2E",
            mint: "#35C994",
            "mint-dark": "#22A677",
            ink: "#211437",
            "ink-muted": "#5E5275",
          },
          fontFamily: {
            display: ["Outfit", "sans-serif"],
            body: ["Quicksand", "sans-serif"],
          },
        },
      },
    };
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #FFF6E8;
        color: #211437;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    .animate-float {
      animation: floatSlow 3.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-cream font-body text-ink flex flex-col min-h-screen selection:bg-grape selection:text-white">
<!-- Top App Bar -->
<header class="fixed top-0 inset-x-0 z-50 bg-cream/90 backdrop-blur-md pt-safe border-b-2 border-lavender/60">
<div class="h-16 max-w-[480px] mx-auto px-4 flex items-center justify-between">
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 rounded-2xl bg-grape flex items-center justify-center shadow-[0_4px_0_#5726D2] text-white">
<span class="font-display font-black text-xl leading-none">4</span>
</div>
<div class="flex flex-col">
<span class="font-display font-extrabold text-lg leading-tight text-ink tracking-tight">Picas y Fijas</span>
<span class="font-display font-bold text-[11px] uppercase tracking-wider text-grape">Party Edition</span>
</div>
</div>
<div class="flex items-center gap-2">
<button aria-label="Sonido" class="w-10 h-10 rounded-2xl bg-white border-2 border-lavender shadow-[0_3px_0_#D4C2FF] flex items-center justify-center text-ink-muted hover:text-grape active:translate-y-0.5 active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-[480px] mx-auto px-4 pt-20 pb-28 flex flex-col justify-between gap-5 relative overflow-hidden">
<!-- Celebration Card with Geometric Confetti & Cute Mascot -->
<section class="relative w-full rounded-[2rem] bg-lavender p-6 pt-7 text-center shadow-[0_8px_0_#D4C2FF] border-2 border-white overflow-hidden">
<!-- Joyful Geometric Confetti -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Coral circle -->
<span class="absolute top-4 left-6 w-3.5 h-3.5 rounded-full bg-coral"></span>
<!-- Sunny yellow pill -->
<span class="absolute top-7 right-7 w-5 h-2.5 rounded-full bg-sunny rotate-45"></span>
<!-- Mint diamond -->
<span class="absolute top-20 left-4 w-3 h-3 rounded-sm bg-mint rotate-45"></span>
<!-- Grape triangle (SVG) -->
<svg class="absolute top-16 right-5 w-4 h-4 text-grape -rotate-12" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 3L22 20H2L12 3Z"></path>
</svg>
<!-- Sunny dot -->
<span class="absolute bottom-24 left-8 w-2.5 h-2.5 rounded-full bg-sunny"></span>
<!-- Coral pill -->
<span class="absolute bottom-28 right-8 w-4 h-2 rounded-full bg-coral -rotate-45"></span>
<!-- Mint circle -->
<span class="absolute top-3 left-1/2 -translate-x-12 w-2.5 h-2.5 rounded-full bg-mint"></span>
</div>
<!-- Cute Smiling Abstract Digit Mascot -->
<div class="relative mx-auto mb-3 w-24 h-24 flex items-center justify-center animate-float">
<div class="absolute inset-1 rounded-full bg-sunny/40 blur-md"></div>
<svg class="relative w-24 h-24 drop-shadow-[0_6px_0_rgba(87,38,210,0.22)]" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Party Hat -->
<path d="M50 6L64 26H36L50 6Z" fill="#FF7868" stroke="#211437" stroke-linejoin="round" stroke-width="3"></path>
<circle cx="50" cy="6" fill="#FFD15C" r="4.5" stroke="#211437" stroke-width="2.5"></circle>
<!-- Mascot Rounded Body (Abstract Digit/Block) -->
<rect fill="#7047EB" height="62" rx="22" stroke="#211437" stroke-width="3.5" width="56" x="22" y="24"></rect>
<!-- Highlight -->
<path d="M32 33C36 30 43 29 50 29" opacity="0.45" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Rosy Cheeks -->
<circle cx="35" cy="57" fill="#FF7868" opacity="0.85" r="4.5"></circle>
<circle cx="65" cy="57" fill="#FF7868" opacity="0.85" r="4.5"></circle>
<!-- Happy Eyes -->
<path d="M36 47C37.5 43.5 42.5 43.5 44 47" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>
<path d="M56 47C57.5 43.5 62.5 43.5 64 47" stroke="#FFFFFF" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Big Cheerful Smile -->
<path d="M40 58C42.5 64.5 57.5 64.5 60 58" stroke="#FFD15C" stroke-linecap="round" stroke-width="4"></path>
<!-- Little Celebrating Arms -->
<path d="M22 52C14 48 11 40 14 35" stroke="#211437" stroke-linecap="round" stroke-width="3.5"></path>
<path d="M78 52C86 48 89 40 86 35" stroke="#211437" stroke-linecap="round" stroke-width="3.5"></path>
</svg>
</div>
<!-- Celebratory Heading -->
<div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-sunny text-ink font-display font-extrabold text-xs uppercase tracking-wider shadow-[0_3px_0_#E5AF2E] mb-2">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">celebration</span>
        ¡Ganaste!
      </div>
<h1 class="font-display font-black text-[34px] leading-[1.08] tracking-tight text-ink">
        ¡Código Descifrado!
      </h1>
<p class="font-body font-semibold text-sm text-ink-muted mt-1.5">
        Adivinaste el número secreto de la fiesta
      </p>
<!-- Revealed Secret 4-Digit Code in Chunky Colorful Tactile Tiles -->
<div class="mt-5 bg-white/80 rounded-3xl p-4 border-2 border-white shadow-inner">
<p class="font-display font-bold text-xs uppercase tracking-wider text-ink-muted mb-3">
          Código Secreto
        </p>
<div class="flex items-center justify-center gap-2.5">
<!-- Tile 1: Grape -->
<div class="w-14 h-16 rounded-2xl bg-grape border-2 border-white shadow-[0_6px_0_#5726D2] flex items-center justify-center">
<span class="font-display font-black text-3xl text-white">4</span>
</div>
<!-- Tile 2: Coral -->
<div class="w-14 h-16 rounded-2xl bg-coral border-2 border-white shadow-[0_6px_0_#E05545] flex items-center justify-center">
<span class="font-display font-black text-3xl text-white">2</span>
</div>
<!-- Tile 3: Sunny Yellow -->
<div class="w-14 h-16 rounded-2xl bg-sunny border-2 border-white shadow-[0_6px_0_#E5AF2E] flex items-center justify-center">
<span class="font-display font-black text-3xl text-ink">8</span>
</div>
<!-- Tile 4: Mint -->
<div class="w-14 h-16 rounded-2xl bg-mint border-2 border-white shadow-[0_6px_0_#22A677] flex items-center justify-center">
<span class="font-display font-black text-3xl text-white">0</span>
</div>
</div>
</div>
</section>
<!-- Clear, Simple Stats Cards (Intentos & Tiempo) -->
<section class="grid grid-cols-2 gap-3.5 w-full">
<!-- Intentos Card -->
<div class="rounded-3xl bg-white p-4 border-2 border-lavender shadow-[0_6px_0_#D4C2FF] flex flex-col items-center text-center">
<div class="w-10 h-10 rounded-2xl bg-lavender flex items-center justify-center text-grape mb-2">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">stadia_controller</span>
</div>
<span class="font-display font-bold text-xs uppercase tracking-wider text-ink-muted">Intentos</span>
<span class="font-display font-black text-4xl text-grape mt-0.5 leading-none">6</span>
</div>
<!-- Tiempo Card -->
<div class="rounded-3xl bg-white p-4 border-2 border-lavender shadow-[0_6px_0_#D4C2FF] flex flex-col items-center text-center">
<div class="w-10 h-10 rounded-2xl bg-sunny/30 flex items-center justify-center text-ink mb-2">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<span class="font-display font-bold text-xs uppercase tracking-wider text-ink-muted">Tiempo</span>
<span class="font-display font-black text-4xl text-ink mt-0.5 leading-none">03:12</span>
</div>
</section>
<!-- Prominent Tactile Action Buttons -->
<section class="flex flex-col gap-3 w-full pt-1">
<button class="w-full h-14 rounded-2xl bg-mint hover:brightness-105 text-white font-display font-extrabold text-lg tracking-wide flex items-center justify-center gap-2 shadow-[0_6px_0_#22A677] active:translate-y-1 active:shadow-[0_2px_0_#22A677] transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">replay</span>
        ¡Jugar Revancha!
      </button>
<button class="w-full h-13 py-3 rounded-2xl bg-lavender hover:bg-lavender-dark/60 text-ink font-display font-bold text-base flex items-center justify-center gap-2 shadow-[0_5px_0_#D4C2FF] active:translate-y-1 active:shadow-[0_2px_0_#D4C2FF] transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">home</span>
        Volver al Inicio
      </button>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-white/95 backdrop-blur-md border-t-2 border-lavender">
<div class="flex justify-around items-center h-16 max-w-[480px] mx-auto px-2">
<a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-grape" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">casino</span>
<span class="font-display font-bold text-[11px]">Jugar</span>
</a>
<a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-ink-muted hover:text-grape transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">menu_book</span>
<span class="font-display font-bold text-[11px]">Reglas</span>
</a>
<a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-ink-muted hover:text-grape transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">trophy</span>
<span class="font-display font-bold text-[11px]">Stats</span>
</a>
<a class="flex flex-col items-center justify-center gap-0.5 min-w-[64px] h-12 text-ink-muted hover:text-grape transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-display font-bold text-[11px]">Ajustes</span>
</a>
</div>
</nav>
</body></html>
